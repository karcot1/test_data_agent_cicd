# Data Agent CI/CD pipeline.
#
# 1. Build a dependencies-only image (cached from the previous :latest), so pip
#    install only re-runs when requirements.txt changes.
# 2. Run the offline unit tests.
# 3. Run the deployer, which creates/updates only the agents whose definitions
#    changed and syncs Agent Registry.
#
# Gemini Enterprise egress IAM is NOT part of this pipeline. After adding agents
# to a GE app, run it manually: python -m deployer.ge_egress --project_id=...
#
# For a pull-request trigger, set the substitution _DEPLOY_ARGS=--dry-run.

substitutions:
  _DEPLOYER_IMAGE: us-docker.pkg.dev/${PROJECT_ID}/agent-repo/agent-deployer
  _DEPLOY_ARGS: ''

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  - id: 'pull-cache'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull ${_DEPLOYER_IMAGE}:latest || true']

  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'deployer/Dockerfile'
      - '--cache-from'
      - '${_DEPLOYER_IMAGE}:latest'
      - '-t'
      - '${_DEPLOYER_IMAGE}:latest'
      - '-t'
      - '${_DEPLOYER_IMAGE}:${BUILD_ID}'
      - '.'

  # Runs alongside the tests; keeps the layer cache warm for the next build.
  - id: 'push-image'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-image']
    args: ['push', '--all-tags', '${_DEPLOYER_IMAGE}']

  - id: 'test'
    name: '${_DEPLOYER_IMAGE}:${BUILD_ID}'
    waitFor: ['build-image']
    entrypoint: 'python'
    args: ['-m', 'pytest', '-q', 'tests']

  - id: 'deploy'
    name: '${_DEPLOYER_IMAGE}:${BUILD_ID}'
    # Also wait for push-image: a failing deploy would otherwise cancel the push.
    waitFor: ['test', 'push-image']
    entrypoint: 'bash'
    args: ['-c', 'python -m deployer --project_id=${PROJECT_ID} ${_DEPLOY_ARGS}']